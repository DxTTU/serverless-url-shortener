<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snip.ly — serverless URL shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020; color: #e8ecf8;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 520px; background: #141b33;
      border: 1px solid #263056; border-radius: 16px; padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    h1 span { color: #7c9cff; }
    p.sub { color: #9aa4c7; font-size: .9rem; margin-bottom: 24px; }
    .row { display: flex; gap: 10px; }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #2c3763; background: #0e1430; color: #e8ecf8;
      font-size: .95rem; outline: none;
    }
    input:focus { border-color: #7c9cff; }
    button {
      padding: 12px 20px; border: none; border-radius: 10px;
      background: #7c9cff; color: #0b1020; font-weight: 700; cursor: pointer;
      font-size: .95rem; white-space: nowrap;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 20px; display: none; }
    #result .box {
      display: flex; align-items: center; gap: 10px;
      background: #0e1430; border: 1px dashed #3a4670;
      border-radius: 10px; padding: 12px 14px;
    }
    #shortUrl { flex: 1; color: #8fd0ff; word-break: break-all; font-size: .9rem; }
    #copyBtn { padding: 8px 14px; font-size: .85rem; }
    #error { margin-top: 14px; color: #ff8f8f; font-size: .85rem; display: none; }
    .foot { margin-top: 24px; font-size: .75rem; color: #5c6690; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>snip<span>.ly</span></h1>
    <p class="sub">serverless URL shortener &mdash; Lambda + API Gateway + DynamoDB</p>
    <div class="row">
      <input id="urlInput" type="url" placeholder="paste a long URL…" autocomplete="off" />
      <button id="shortenBtn">Shorten</button>
    </div>
    <div id="error"></div>
    <div id="result">
      <div class="box">
        <span id="shortUrl"></span>
        <button id="copyBtn">Copy</button>
      </div>
    </div>
    <p class="foot">runs on AWS serverless &mdash; you pay $0 when nobody uses it</p>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
